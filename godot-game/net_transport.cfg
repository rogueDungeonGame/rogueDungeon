; Network transport toggle config
; transport options:
;   enet  -> ENet direct
;   sdr   -> Steam relay (SteamMultiplayerPeer)
; lobby actions:
;   disabled -> do not create/join Steam lobby automatically
;   create   -> create a Steam lobby, then host with Steam SDR
;   join     -> join an existing Steam lobby, then connect with Steam SDR

[network]
transport="enet"
steam_app_id=480
steam_embed_callbacks=true
steam_virtual_port=0
steam_local_id=""
steam_host_id=""
steam_lobby_enabled=false
steam_lobby_action="disabled"
steam_lobby_visibility="friends_only"
steam_lobby_max_members=4
steam_lobby_id=""
steam_lobby_name="RogueDungeon"
host_migration_enabled=true
